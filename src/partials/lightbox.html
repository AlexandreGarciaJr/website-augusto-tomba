  <!-- Lightbox de obra (preview rápida ao clicar num item do mosaico) -->
  <div class="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" data-lightbox-close></div>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Visualização da obra">
      <button class="lightbox-close" data-lightbox-close aria-label="Fechar">✕</button>
      <div class="lightbox-stage">
        <button class="lightbox-nav lightbox-prev" aria-label="Obra anterior">←</button>
        <div class="ph lightbox-image"><span class="ph-label lightbox-image-label"></span></div>
        <button class="lightbox-nav lightbox-next" aria-label="Próxima obra">→</button>
      </div>
      <div class="lightbox-caption">
        <span class="lightbox-eyebrow">obra <span class="lightbox-num"></span></span>
        <h3 class="lightbox-title">[ Título da obra ]</h3>
        <p class="lightbox-meta">[ Técnica, ano ]</p>
        <a class="cta lightbox-full-link" href="#">ver página da obra →</a>
      </div>
    </div>
  </div>
