<!--obra: template de uma obra; build.js gera obras/<slug>.html para cada obra de src/data/obras.json -->
{{> head}}

<main id="main-content">

  <section class="page-banner">
    <div class="wrap">
      <a class="back-link" href="{{root}}quadros.html#{{colecaoId}}">← {{colecaoTitulo}}</a>

      <div class="split">
        <div class="ph ratio-tall reveal-left">
          <span class="ph-label">[ imagem da obra {{num}}, em alta resolução ]</span>
        </div>
        <div class="reveal-right delay">
          <span class="eyebrow">obra {{num}} · {{colecaoTitulo}}</span>
          <h1 class="section-title" style="font-size:clamp(2rem,4.4vw,2.8rem);">{{titulo}}</h1>

          <ul class="meta-list">
            <li><span>Técnica</span><span>{{tecnica}}</span></li>
            <li><span>Dimensões</span><span>{{dimensoes}}</span></li>
            <li><span>Ano</span><span>{{ano}}</span></li>
            <li><span>Disponibilidade</span><span>{{disponibilidade}}</span></li>
          </ul>

          <p class="lede">{{descricao}}</p>

          <a class="cta" href="{{root}}index.html#contato">consultar disponibilidade →</a>
        </div>
      </div>
    </div>
  </section>

</main>

{{> footer}}
{{> end}}
